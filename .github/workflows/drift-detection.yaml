# ╔═══════════════════════════════════════════════════════════════════╗
# ║  DRIFT DETECTION WORKFLOW                                         ║
# ║  Triggered on: Schedule (Daily at 00:00 UTC)                      ║
# ║  Purpose: Identify out-of-band schema changes made directly in BQ ║
# ╚═══════════════════════════════════════════════════════════════════╝

name: Detect Schema Drift (PRD)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (PRD)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.PRD_WIF_PROVIDER }}
          service_account: ${{ secrets.PRD_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch Current BQ Schema (INFORMATION_SCHEMA)
        id: bq-schema
        run: |
          echo "Fetching active tables and columns directly from BigQuery..."
          bq query --use_legacy_sql=false --format=csv \
            "SELECT table_name, column_name, data_type FROM \`${{ secrets.PRD_BQ_PROJECT_ID }}.${{ secrets.PRD_BQ_DATASET_ID }}.INFORMATION_SCHEMA.COLUMNS\`" > bq_actual_schema.csv

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Download and Install Simba Driver
        run: |
          wget -q https://storage.googleapis.com/simba-bq-release/jdbc/SimbaJDBCDriverforGoogleBigQuery42_1.6.3.1004.zip || echo "Failed to download, assuming cached"
          unzip -q SimbaJDBCDriverforGoogleBigQuery42_1.6.3.1004.zip || true
          ./mvnw install:install-file -Dfile=GoogleBigQueryJDBC42.jar -DgroupId=com.simba.googlebigquery.jdbc -DartifactId=GoogleBigQueryJDBC42 -Dversion=1.6.3.1004 -Dpackaging=jar -q

      - name: Verify Liquibase Status
        run: |
          echo "Checking if Liquibase has any unapplied changes in PRD..."
          # If someone deployed code but didn't run Liquibase, this catches it
          ./mvnw spring-boot:run -q -B \
            -Dspring-boot.run.profiles=prd \
            -Dspring-boot.run.arguments="--action=status"

      - name: Report Drift
        run: |
          echo "Schema Information saved to bq_actual_schema.csv"
          echo "To rigorously check for drift, you can compare this CSV against a pristine deployment of the Liquibase XML."
          echo "If drift is detected, open an incident."

      - name: Post Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Schema Drift Detected in Production',
              body: 'The nightly drift detection workflow failed. This could indicate out-of-band schema changes in BigQuery or pending Liquibase migrations that were missed during deployment.\n\n[View Workflow Run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            })
