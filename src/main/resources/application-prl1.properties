####################################################################
#  PRL1 Environment — BigQuery Configuration
####################################################################
#  GCP Project and Dataset for PRL1 (Pre-Release 1)
####################################################################

# ======================== DataSource =============================
spring.datasource.url=jdbc:bigquery://https://www.googleapis.com/bigquery/v2:443;\
  ProjectId=${BQ_PROJECT_ID:your-gcp-project-prl1};\
  DefaultDataset=${BQ_DATASET_ID:your_dataset_prl1};\
  OAuthType=${BQ_OAUTH_TYPE:3}
spring.datasource.driver-class-name=com.simba.googlebigquery.jdbc.Driver

# ======================== Logging ================================
logging.level.liquibase=INFO
logging.level.com.example.liquidbasebq=INFO
