####################################################################
#  PRD Environment — BigQuery Configuration
####################################################################
#  GCP Project and Dataset for Production
#
#  ⚠️  CAUTION: This targets PRODUCTION. All changes are applied
#     via CI/CD with manual approval gates only.
####################################################################

# ======================== DataSource =============================
spring.datasource.url=jdbc:bigquery://https://www.googleapis.com/bigquery/v2:443;\
  ProjectId=${BQ_PROJECT_ID:your-gcp-project-prd};\
  DefaultDataset=${BQ_DATASET_ID:your_dataset_prd};\
  OAuthType=${BQ_OAUTH_TYPE:3}
spring.datasource.driver-class-name=com.simba.googlebigquery.jdbc.Driver

# ======================== Logging ================================
logging.level.liquibase=WARN
logging.level.com.example.liquidbasebq=INFO
