####################################################################
#  Spring Boot — Liquibase & DataSource Configuration
####################################################################
#  Base configuration. Environment-specific settings are in:
#    env/dev/dev1/application-dev1.properties
#    env/dev/dev2/application-dev2.properties
#    env/prl1/application-prl1.properties
#    env/uat/uat1/application-uat1.properties
#    env/uat/uat2/application-uat2.properties
#    env/prd/application-prd.properties
#
#  Activate a profile:
#    mvn spring-boot:run -Dspring-boot.run.profiles=dev1
#    mvn spring-boot:run -Dspring-boot.run.profiles=uat2
#    java -jar app.jar --spring.profiles.active=prd
#    export SPRING_PROFILES_ACTIVE=prl1
####################################################################

# ======================== Application ============================
spring.application.name=liquidbase-bq

# ======================== Default Profile ========================
# Defaults to 'dev1' if no profile is specified.
# Override with: --spring.profiles.active=dev2|prl1|uat1|uat2|prd
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev1}

# ======================== DataSource (defaults — overridden by profile) ===
spring.datasource.url=jdbc:bigquery://https://www.googleapis.com/bigquery/v2:443;\
  ProjectId=${BQ_PROJECT_ID:your-gcp-project-dev};\
  DefaultDataset=${BQ_DATASET_ID:dev_dataset_1};\
  OAuthType=${BQ_OAUTH_TYPE:3}
spring.datasource.driver-class-name=com.simba.googlebigquery.jdbc.Driver

# ======================== Liquibase ==============================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Disabled — schema operations controlled via SchemaManagerRunner --action flag
spring.liquibase.enabled=false

# ======================== Logging (defaults) =====================
logging.level.liquibase=INFO
logging.level.com.example.liquidbasebq=DEBUG
