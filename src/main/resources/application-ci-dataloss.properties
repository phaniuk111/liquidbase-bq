# Use the generic BigQuery driver
spring.datasource.driver-class-name=com.simba.googlebigquery.jdbc.Driver

# Connection string using environment variables injected by GitHub Actions
spring.datasource.url=jdbc:bigquery://https://www.googleapis.com/bigquery/v2:443;ProjectId=${BQ_PROJECT_ID};DefaultDataset=${BQ_DATASET_ID};OAuthType=3

# Let Liquibase manage schema, specifically targeting our Data Loss changelog
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/test/dataloss-changelog.xml
spring.liquibase.default-schema=${BQ_DATASET_ID}
spring.liquibase.liquibase-schema=${BQ_DATASET_ID}

# Enforce warnings for missing rollbacks/comments
liquibase.property.require-rollback=true
liquibase.property.require-comments=true

# Logging
logging.level.liquibase=INFO
logging.level.com.example.liquidbasebq=DEBUG
